<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARSX | Official Website</title>

<style>

/* GENERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #fff;
    color: #000;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

.header {
    position: absolute;
    top: 30px;
    left: 30px;
    right: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.date {
    font-size: 12px;
    letter-spacing: 1px;
    color: #777;
}

.owner {
    font-size: 12px;
    letter-spacing: 2px;
    color: #222;
}

/* HERO */

.hero {
    height: 100vh;
    min-height: 550px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.container {
    text-align: center;
}

.logo {
    font-size: clamp(65px, 15vw, 125px);
    font-weight: 900;
    letter-spacing: -7px;

    background: linear-gradient(
        145deg,
        #000 20%,
        #555 40%,
        #000 55%,
        #777 65%,
        #000 80%
    );

    background-size: 200% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;

    animation: shine 5s linear infinite;

    filter: drop-shadow(
        0px 5px 5px rgba(0,0,0,0.15)
    );
}

.logo .small {
    font-size: 0.75em;
}

@keyframes shine {
    to {
        background-position: 200% center;
    }
}

/* COMING SOON */

.coming {
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 6px;
    color: #222;
}

.footer {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #999;
}

/* SCROLL */

.scroll-indicator {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 10px;
    letter-spacing: 4px;
    color: #999;

    animation: scrollMove 2s infinite;
}

@keyframes scrollMove {
    0%, 100% {
        transform: translate(-50%, 0);
    }

    50% {
        transform: translate(-50%, 10px);
    }
}

/* ABOUT */

.about {
    min-height: 75vh;
    padding: 100px 25px;

    border-top: 1px solid #eee;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
}

.section-title {
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.section-text {
    font-size: 13px;
    color: #888;
    letter-spacing: 1px;
    text-align: center;
    line-height: 2;
    max-width: 500px;
}

/* TELEGRAM */

.telegram {
    margin-top: 65px;

    display: flex;
    align-items: center;
    gap: 12px;

    text-decoration: none;
    color: #111;

    border: 1px solid #ddd;
    padding: 13px 25px;

    transition: 0.3s;
}

.telegram:hover {
    background: #000;
    color: #fff;
    border-color: #000;
    transform: translateY(-3px);
}

.telegram svg {
    width: 21px;
    height: 21px;
    fill: currentColor;
}

.telegram span {
    font-size: 12px;
    letter-spacing: 3px;
}

/* =================================
   REALISTIC SPIDERS
================================= */

.spider {
    position: fixed;
    width: 55px;
    height: 55px;

    z-index: 20;
    pointer-events: none;

    filter: drop-shadow(
        3px 5px 3px rgba(0,0,0,.25)
    );
}

.spider svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* LEGS */

.spider .leg {
    fill: none;
    stroke: #111;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* LEFT LEGS */

.spider .left-legs {
    transform-box: fill-box;
    transform-origin: center;

    animation: legsLeft .32s ease-in-out infinite alternate;
}

/* RIGHT LEGS */

.spider .right-legs {
    transform-box: fill-box;
    transform-origin: center;

    animation: legsRight .32s ease-in-out infinite alternate;
}

@keyframes legsLeft {
    from {
        transform: rotate(-12deg);
    }

    to {
        transform: rotate(12deg);
    }
}

@keyframes legsRight {
    from {
        transform: rotate(12deg);
    }

    to {
        transform: rotate(-12deg);
    }
}

/* BODY */

.spider .body {
    fill: #111;
}

.spider .highlight {
    fill: #555;
}

.spider .eye {
    fill: white;
}

/* WALKING SPIDER */

.spider-one {
    top: 45%;
    left: -60px;

    animation: spiderWalk 32s linear infinite;
}

@keyframes spiderWalk {

    0% {
        left: -60px;
        top: 45%;
    }

    25% {
        left: 30%;
        top: 43%;
    }

    50% {
        left: 60%;
        top: 50%;
    }

    75% {
        left: 85%;
        top: 40%;
    }

    100% {
        left: 110%;
        top: 45%;
    }
}

/* HANGING SPIDER */

.spider-two {
    right: 12%;
    top: 20px;

    animation: spiderHang 7s ease-in-out infinite;
}

/* WEB */

.spider-two::before {
    content: "";

    position: absolute;

    width: 1px;
    height: 65px;

    background: #222;

    left: 50%;
    bottom: 48px;
}

@keyframes spiderHang {

    0%, 100% {
        transform: translateY(-15px);
    }

    50% {
        transform: translateY(45px);
    }
}

/* BOTTOM */

.bottom {
    text-align: center;

    padding: 25px;

    border-top: 1px solid #eee;

    font-size: 10px;
    letter-spacing: 3px;
    color: #aaa;
}

/* MOBILE */

@media(max-width: 600px) {

    .header {
        top: 22px;
        left: 20px;
        right: 20px;
    }

    .logo {
        letter-spacing: -4px;
    }

    .section-title {
        font-size: 21px;
    }

    .section-text {
        font-size: 12px;
    }

    .spider {
        transform: scale(.8);
    }
}

/* REDUCE MOTION */

@media (prefers-reduced-motion: reduce) {

    .spider,
    .spider .left-legs,
    .spider .right-legs,
    .logo,
    .scroll-indicator {
        animation: none;
    }
}

</style>
</head>

<body>

<!-- DATE SCRIPT -->

<script>

function updateDate() {

    const today = new Date();

    const options = {

        day: '2-digit',

        month: 'long',

        year: 'numeric'

    };

    document.getElementById("date").innerText =

        today.toLocaleDateString('en-US', options);

}

updateDate();

</script>
